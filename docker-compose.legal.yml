version: "3.9"

services:

  juridicotech-runtime:
    build: .
    ports:
      - "8920:8920"
    environment:
      NATS_SERVERS: nats://nats:4222
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

  redis:
    image: redis:7

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password

  nats:
    image: nats:2.10
    command: ["-js"]