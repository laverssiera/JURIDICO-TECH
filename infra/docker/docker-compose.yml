version: "3.9"

services:
  backend-api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../../apps/backend-api:/app
    command: bash -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://juridico:juridico@postgres:5432/juridico
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
    depends_on:
      - postgres
      - redis
      - nats

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: juridico
      POSTGRES_PASSWORD: juridico
      POSTGRES_DB: juridico
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  legal-worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../apps/legal-worker:/app
    command: bash -lc "pip install -r requirements.txt && uvicorn worker.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    environment:
      WORKER_DATABASE_URL: postgresql+asyncpg://juridico:juridico@postgres:5432/juridico
      WORKER_NATS_URL: nats://nats:4222
      WORKER_POLL_INTERVAL: "5"
      WORKER_MAX_ATTEMPTS: "5"
    depends_on:
      - postgres
      - nats

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
