name: backend-api-ci

on:
  push:
    paths:
      - "apps/backend-api/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/backend-api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
